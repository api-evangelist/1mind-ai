name: 1mind AI
description: >-
  1mind is an AI-led go-to-market (GTM) company building photorealistic AI
  "Superhumans" — agents with a face, voice, memory, and domain knowledge that
  engage, qualify, demo, and convert buyers across web, in-app, email, and live
  video calls. Founded by Amanda Kahlow (previously founder of 6sense) and Sachin
  Bhat (former head of engineering at Rippling), 1mind publicly launched in
  November 2025 with $40M in total funding, including a $30M Series A led by
  Battery Ventures. Its Superhumans work with 45+ companies including HubSpot,
  ZoomInfo, and New Relic to automate marketing, sales, and customer success
  motions in real time. Its Ride-Along product joins live sales calls as a named,
  visible AI sales engineer that speaks directly to buyers.
